<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#059669">
<title>Aktivasi Notifikasi Guru</title>

<script src="./config.js"></script>
<script
  src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
  defer>
</script>

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f3f4f6;
  margin:0;
  color:#1f2937;
}

.wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.card{
  width:min(430px,100%);
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:28px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.icon{
  width:52px;
  height:52px;
  border-radius:16px;
  background:#ecfdf5;
  color:#059669;
  display:grid;
  place-items:center;
  margin:0 auto 16px;
  font-size:25px;
}

h1{
  text-align:center;
  font-size:20px;
  margin:0 0 8px;
}

.sub{
  text-align:center;
  color:#6b7280;
  font-size:13px;
  line-height:1.55;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px 16px;
  background:#059669;
  color:#fff;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  margin-top:20px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  margin-top:14px;
  font-size:12px;
  line-height:1.55;
  text-align:center;
}

.ok{
  color:#059669;
}

.err{
  color:#dc2626;
}

.muted{
  color:#6b7280;
}
</style>
</head>

<body>

<div class="wrap">
  <main class="card">

    <div class="icon">🔔</div>

    <h1>Aktivasi Notifikasi Guru</h1>

    <p id="intro" class="sub">
      Memeriksa link aktivasi...
    </p>

    <button id="allow" disabled>
      🔔 IZINKAN NOTIFIKASI
    </button>

    <div id="status" class="status muted"></div>

  </main>
</div>

<script>
(() => {

  'use strict';

  const cfg =
    window.PUSH_CONFIG || {};

  const qs =
    new URLSearchParams(location.search);

  const token =
    (qs.get('activate') || '').trim();

  const madrasahId =
    (qs.get('m') || '').trim();

  const intro =
    document.getElementById('intro');

  const btn =
    document.getElementById('allow');

  const status =
    document.getElementById('status');

  let activation = null;
  let oneSignalInstance = null;


  /* =========================================================
     STATUS
     ========================================================= */

  function setStatus(
    text,
    cls = 'muted'
  ){

    status.textContent = text;

    status.className =
      'status ' + cls;

  }


  /* =========================================================
     JSONP -> GAS
     ========================================================= */

  function jsonp(params){

    return new Promise(
      (resolve,reject) => {

        const callback =
          '__pushHostCb_' +
          Date.now() +
          '_' +
          Math.random()
            .toString(36)
            .slice(2);

        const script =
          document.createElement('script');

        let done = false;


        const cleanup = () => {

          try{
            delete window[callback];
          }catch(e){}

          script.remove();

        };


        const finish =
          (fn,value) => {

            if(done)
              return;

            done = true;

            clearTimeout(timer);

            cleanup();

            fn(value);

          };


        const timer =
          setTimeout(
            () => {

              finish(
                reject,
                new Error(
                  'Google Apps Script tidak merespons. Pastikan Web App sudah dideploy sebagai versi terbaru.'
                )
              );

            },
            20000
          );


        window[callback] =
          data =>
            finish(
              resolve,
              data
            );


        let url;

        try{

          url =
            new URL(
              cfg.GAS_WEB_APP_URL
            );

        }catch(error){

          finish(
            reject,
            new Error(
              'URL Google Apps Script tidak valid.'
            )
          );

          return;

        }


        Object.entries(params)
          .forEach(
            ([key,value]) => {

              url.searchParams.set(
                key,
                String(value)
              );

            }
          );


        url.searchParams.set(
          'callback',
          callback
        );


        script.src =
          url.toString();


        script.onerror =
          () => {

            finish(
              reject,
              new Error(
                'Gagal menghubungi Google Apps Script.'
              )
            );

          };


        document.head
          .appendChild(script);

      }
    );

  }


  /* =========================================================
     VERIFIKASI LINK AKTIVASI
     ========================================================= */

  async function verifyActivation(){

    if(
      !token ||
      !madrasahId
    ){

      throw new Error(
        'Link aktivasi tidak lengkap.'
      );

    }


    if(
      !cfg.GAS_WEB_APP_URL ||
      !cfg.ONESIGNAL_APP_ID
    ){

      throw new Error(
        'Konfigurasi PushHost belum lengkap.'
      );

    }


    const result =
      await jsonp({

        push:
          'activationInfo',

        activate:
          token,

        m:
          madrasahId

      });


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.message ||
        'Link aktivasi tidak valid atau sudah kedaluwarsa.'
      );

    }


    return result.data;

  }


  /* =========================================================
     ONESIGNAL INIT
     ========================================================= */

  async function initOneSignal(){

    window.OneSignalDeferred =
      window.OneSignalDeferred || [];


    return new Promise(
      (resolve,reject) => {

        window.OneSignalDeferred.push(
          async function(OneSignal){

            try{

              await OneSignal.init({

                appId:
                  cfg.ONESIGNAL_APP_ID,

                /*
                 * DIPERTAHANKAN DARI BASELINE.
                 */
                serviceWorkerPath:
                  'absensi-push/OneSignalSDKWorker.js',

                serviceWorkerParam: {

                  scope:
                    '/absensi-push/'

                },

                autoResubscribe:
                  true

              });


              resolve(
                OneSignal
              );

            }catch(error){

              reject(error);

            }

          }
        );

      }
    );

  }


  /* =========================================================
     TUNGGU PUSH SUBSCRIPTION
     
     PATCH UTAMA:
     Gunakan listener "change", bukan hanya polling.
     
     OneSignal dapat membuat ID/token beberapa saat setelah
     permission/optIn berubah.
     ========================================================= */

  function waitForPushSubscription(
    OneSignal,
    timeoutMs = 60000
  ){

    const subscription =
      OneSignal
        ?.User
        ?.PushSubscription;


    if(!subscription){

      return Promise.reject(
        new Error(
          'OneSignal Push Subscription belum tersedia.'
        )
      );

    }


    function readState(){

      return {

        id:
          subscription.id ||
          null,

        token:
          subscription.token ||
          null,

        optedIn:
          subscription.optedIn === true

      };

    }


    function ready(state){

      return (
        !!state.id &&
        !!state.token &&
        state.optedIn === true
      );

    }


    /*
     * Periksa state yang sudah tersedia.
     */

    const initial =
      readState();


    if(
      ready(initial)
    ){

      return Promise.resolve({

        subscriptionId:
          initial.id,

        pushToken:
          initial.token

      });

    }


    return new Promise(
      (resolve,reject) => {

        let finished = false;


        const cleanup = () => {

          try{

            subscription.removeEventListener(
              'change',
              onChange
            );

          }catch(error){}

          clearTimeout(
            timer
          );

        };


        const finish =
          (fn,value) => {

            if(finished)
              return;

            finished = true;

            cleanup();

            fn(value);

          };


        const onChange =
          event => {

            console.log(
              '[OneSignal] PushSubscription change:',
              event
            );


            const current =
              event?.current ||
              readState();


            if(
              !ready(current)
            ){

              return;

            }


            finish(
              resolve,
              {

                subscriptionId:
                  current.id,

                pushToken:
                  current.token

              }
            );

          };


        const timer =
          setTimeout(
            () => {

              const current =
                readState();


              if(
                ready(current)
              ){

                finish(
                  resolve,
                  {

                    subscriptionId:
                      current.id,

                    pushToken:
                      current.token

                  }
                );

                return;

              }


              finish(
                reject,
                new Error(
                  'OneSignal belum mendapatkan Push Token dalam 60 detik. Pastikan izin notifikasi sudah diizinkan dan Service Worker aktif.'
                )
              );

            },
            timeoutMs
          );


        /*
         * PENTING:
         * Listener dipasang SEBELUM optIn().
         */

        subscription.addEventListener(
          'change',
          onChange
        );


        /*
         * Cek sekali lagi setelah listener
         * terpasang untuk menghindari race condition.
         */

        const afterListener =
          readState();


        if(
          ready(afterListener)
        ){

          finish(
            resolve,
            {

              subscriptionId:
                afterListener.id,

              pushToken:
                afterListener.token

            }
          );

        }

      }
    );

  }


  /* =========================================================
     PROSES AKTIVASI
     ========================================================= */

  async function activate(){

    btn.disabled = true;

    btn.textContent =
      'MEMPROSES...';


    try{

      /* -----------------------------------------------------
         1. Pastikan activation info tersedia
         ----------------------------------------------------- */

      if(!activation){

        activation =
          await verifyActivation();

      }


      /* -----------------------------------------------------
         2. Init OneSignal
         ----------------------------------------------------- */

      const OneSignal =
        await initOneSignal();

      oneSignalInstance =
        OneSignal;


      /* -----------------------------------------------------
         3. Cek dukungan Web Push
         ----------------------------------------------------- */

      if(
        !OneSignal
          .Notifications
          .isPushSupported()
      ){

        throw new Error(
          'Browser/perangkat ini tidak mendukung Web Push.'
        );

      }


      /* -----------------------------------------------------
         4. Permission
         ----------------------------------------------------- */

      if(
        Notification.permission ===
        'denied'
      ){

        throw new Error(
          'Izin notifikasi pada situs ini ditolak. Reset izin situs ini lalu buka ulang link aktivasi.'
        );

      }


      setStatus(
        'Meminta izin notifikasi...',
        'muted'
      );


      await OneSignal
        .Notifications
        .requestPermission();


      if(
        Notification.permission !==
        'granted'
      ){

        throw new Error(
          'Izin notifikasi belum diberikan.'
        );

      }


      /* -----------------------------------------------------
         5. External ID
         ----------------------------------------------------- */

      const kodeGuru =
        String(
          activation.kodeGuru ||
          ''
        );


      if(!kodeGuru){

        throw new Error(
          'Kode guru dari server tidak tersedia.'
        );

      }


      const externalId =
        madrasahId +
        ':' +
        kodeGuru;


      setStatus(
        'Menghubungkan perangkat dengan guru...',
        'muted'
      );


      await OneSignal.login(
        externalId
      );


      /* -----------------------------------------------------
         6. PASANG LISTENER TERLEBIH DAHULU
         ----------------------------------------------------- */

      setStatus(
        'Menyiapkan Push Subscription...',
        'muted'
      );


      const subscriptionPromise =
        waitForPushSubscription(
          OneSignal,
          60000
        );


      /* -----------------------------------------------------
         7. OPT-IN
         
         Listener sudah aktif sebelum optIn().
         Ini inti perbaikan.
         ----------------------------------------------------- */

      await OneSignal
        .User
        .PushSubscription
        .optIn();


      /* -----------------------------------------------------
         8. Tunggu ID + TOKEN + optedIn
         ----------------------------------------------------- */

      setStatus(
        'Menunggu Push Token...',
        'muted'
      );


      const subscription =
        await subscriptionPromise;


      console.log(
        '[OneSignal] Subscription siap:',
        {
          subscriptionId:
            subscription.subscriptionId,

          pushTokenReady:
            !!subscription.pushToken
        }
      );


      /* -----------------------------------------------------
         9. REGISTER KE GAS
         ----------------------------------------------------- */

      setStatus(
        'Mendaftarkan perangkat ke sistem...',
        'muted'
      );


      const saved =
        await jsonp({

          push:
            'register',

          activate:
            token,

          m:
            madrasahId,

          subscriptionId:
            subscription.subscriptionId,

          deviceLabel:
            navigator.userAgent
              .slice(0,120)

        });


      if(
        !saved ||
        !saved.success
      ){

        throw new Error(
          saved?.message ||
          'Subscription gagal disimpan.'
        );

      }


      /* -----------------------------------------------------
         10. BERHASIL
         ----------------------------------------------------- */

      btn.textContent =
        '✅ NOTIFIKASI AKTIF';


      setStatus(
        'Notifikasi berhasil diaktifkan pada perangkat ini.',
        'ok'
      );


      btn.disabled = true;


    }catch(error){

      console.error(
        'Push activation error:',
        error
      );


      setStatus(
        error?.message ||
        'Gagal mengaktifkan notifikasi.',
        'err'
      );


      btn.disabled =
        false;


      btn.textContent =
        '🔔 IZINKAN NOTIFIKASI';

    }

  }


  /* =========================================================
     PEMERIKSAAN AWAL LINK
     ========================================================= */

  (async function start(){

    try{

      activation =
        await verifyActivation();


      intro.textContent =
        'Kode guru ' +
        (activation.kodeGuru || '-') +
        ' terverifikasi. Klik tombol untuk mengaktifkan notifikasi.';


      btn.disabled =
        false;


      setStatus(
        'Siap mengaktifkan notifikasi.',
        'muted'
      );


    }catch(error){

      console.error(
        'Activation verification error:',
        error
      );


      intro.textContent =
        'Aktivasi tidak dapat dilanjutkan.';


      setStatus(
        error?.message ||
        'Link aktivasi tidak valid.',
        'err'
      );

    }

  })();


  /* =========================================================
     BUTTON
     ========================================================= */

  btn.addEventListener(
    'click',
    activate
  );


})();
</script>

</body>
</html>
