<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#059669">

<title>Aktivasi Notifikasi Guru</title>

<script src="./config.js"></script>

<script
  src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
  defer>
</script>

<style>
  body {
    font-family:
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;

    background: #f3f4f6;
    margin: 0;
    color: #1f2937;
  }

  .wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    box-sizing: border-box;
  }

  .card {
    width: min(430px, 100%);
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 28px;
    box-sizing: border-box;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
  }

  .icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: #ecfdf5;
    color: #059669;

    display: grid;
    place-items: center;

    margin: 0 auto 16px;

    font-size: 25px;
  }

  h1 {
    text-align: center;
    font-size: 20px;
    margin: 0 0 8px;
  }

  .sub {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    line-height: 1.55;
  }

  button {
    width: 100%;

    border: 0;
    border-radius: 12px;

    padding: 13px 16px;

    background: #059669;
    color: #fff;

    font-weight: 700;
    font-size: 14px;

    cursor: pointer;

    margin-top: 20px;
  }

  button:disabled {
    opacity: .6;
    cursor: not-allowed;
  }

  .status {
    margin-top: 14px;

    font-size: 12px;
    line-height: 1.55;

    text-align: center;
  }

  .ok {
    color: #059669;
  }

  .err {
    color: #dc2626;
  }

  .muted {
    color: #6b7280;
  }
</style>
</head>

<body>

<div class="wrap">

  <main class="card">

    <div class="icon">
      🔔
    </div>

    <h1>
      Aktivasi Notifikasi Guru
    </h1>

    <p
      id="intro"
      class="sub">
      Memeriksa link aktivasi...
    </p>

    <button
      id="allow"
      type="button"
      disabled>
      🔔 IZINKAN NOTIFIKASI
    </button>

    <div
      id="status"
      class="status muted">
    </div>

  </main>

</div>


<script>
(function () {

  'use strict';


  /*
   * ============================================================
   * KONFIGURASI
   * ============================================================
   */

  const cfg =
    window.PUSH_CONFIG || {};


  /*
   * ============================================================
   * PARAMETER LINK
   * ============================================================
   *
   * Contoh:
   *
   * activate.html
   * ?activate=TOKEN
   * &m=MADRASAH_ID
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const activationToken =
    String(
      params.get('activate') || ''
    ).trim();


  const madrasahId =
    String(
      params.get('m') || ''
    ).trim();


  /*
   * ============================================================
   * ELEMENT UI
   * ============================================================
   */

  const intro =
    document.getElementById(
      'intro'
    );


  const button =
    document.getElementById(
      'allow'
    );


  const status =
    document.getElementById(
      'status'
    );


  /*
   * ============================================================
   * DATA AKTIVASI
   * ============================================================
   */

  let activationInfo =
    null;


  /*
   * ============================================================
   * STATUS UI
   * ============================================================
   */

  function setStatus(
    message,
    type
  ) {

    status.textContent =
      message || '';


    status.className =
      'status ' +
      (
        type ||
        'muted'
      );

  }


  /*
   * ============================================================
   * JSONP → GOOGLE APPS SCRIPT
   * ============================================================
   *
   * TIDAK mengubah struktur endpoint GAS.
   *
   * Parameter tetap:
   *
   * activationInfo
   * register
   * activate
   * m
   */

  function callGas(
    values
  ) {

    return new Promise(
      function (
        resolve,
        reject
      ) {

        const callbackName =
          '__pushHostCallback_' +
          Date.now() +
          '_' +
          Math.random()
            .toString(36)
            .slice(2);


        const script =
          document.createElement(
            'script'
          );


        let finished =
          false;


        const timeout =
          setTimeout(
            function () {

              finish(
                reject,
                new Error(
                  'Google Apps Script tidak merespons.'
                )
              );

            },
            20000
          );


        function cleanup() {

          clearTimeout(
            timeout
          );


          try {

            delete window[
              callbackName
            ];

          } catch (e) {}


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }

        }


        function finish(
          fn,
          value
        ) {

          if (
            finished
          ) {

            return;

          }


          finished =
            true;


          cleanup();


          fn(
            value
          );

        }


        window[
          callbackName
        ] =
          function (
            response
          ) {

            finish(
              resolve,
              response
            );

          };


        if (
          !cfg.GAS_WEB_APP_URL
        ) {

          finish(
            reject,
            new Error(
              'GAS_WEB_APP_URL belum tersedia pada config.js.'
            )
          );

          return;

        }


        let url;

        try {

          url =
            new URL(
              cfg.GAS_WEB_APP_URL
            );

        } catch (e) {

          finish(
            reject,
            new Error(
              'GAS_WEB_APP_URL tidak valid.'
            )
          );

          return;

        }


        Object.keys(values)
          .forEach(
            function (key) {

              url.searchParams.set(
                key,
                String(
                  values[key] ?? ''
                )
              );

            }
          );


        url.searchParams.set(
          'callback',
          callbackName
        );


        script.src =
          url.toString();


        script.async =
          true;


        script.onerror =
          function () {

            finish(
              reject,
              new Error(
                'Gagal menghubungi Google Apps Script.'
              )
            );

          };


        document.head.appendChild(
          script
        );

      }
    );

  }


  /*
   * ============================================================
   * VERIFIKASI LINK AKTIVASI
   * ============================================================
   */

  async function getActivationInfo() {

    if (
      !activationToken
    ) {

      throw new Error(
        'Parameter activate tidak ditemukan.'
      );

    }


    if (
      !madrasahId
    ) {

      throw new Error(
        'Parameter m tidak ditemukan.'
      );

    }


    const response =
      await callGas({

        push:
          'activationInfo',

        activate:
          activationToken,

        m:
          madrasahId

      });


    if (
      !response ||
      response.success !== true
    ) {

      throw new Error(
        response &&
        response.message
          ? response.message
          : 'Link aktivasi tidak valid atau sudah kedaluwarsa.'
      );

    }


    return (
      response.data ||
      {}
    );

  }


  /*
   * ============================================================
   * INISIALISASI ONESIGNAL
   * ============================================================
   *
   * Worker:
   *
   * /absensi-push/OneSignalSDKWorker.js
   *
   * Jangan mengubah file worker.
   */

  async function initOneSignal() {

    if (
      !cfg.ONESIGNAL_APP_ID
    ) {

      throw new Error(
        'ONESIGNAL_APP_ID belum tersedia pada config.js.'
      );

    }


    window.OneSignalDeferred =
      window.OneSignalDeferred ||
      [];


    return new Promise(
      function (
        resolve,
        reject
      ) {

        window.OneSignalDeferred.push(
          async function (
            OneSignal
          ) {

            try {

              await OneSignal.init({

                appId:
                  cfg.ONESIGNAL_APP_ID,

                serviceWorkerPath:
                  '/absensi-push/OneSignalSDKWorker.js',

                serviceWorkerParam: {

                  scope:
                    '/absensi-push/'

                },

                autoResubscribe:
                  true

              });


              resolve(
                OneSignal
              );

            } catch (
              error
            ) {

              reject(
                error
              );

            }

          }
        );

      }
    );

  }


  /*
   * ============================================================
   * AMBIL SUBSCRIPTION ONESIGNAL
   * ============================================================
   *
   * PENTING:
   *
   * Jangan menunggu:
   *
   * subscription.token
   *
   * karena bukti aktual OneSignal menunjukkan:
   *
   * Subscription ID tersedia
   * Status = Subscribed
   *
   * Yang diperlukan GAS untuk register adalah:
   *
   * subscriptionId
   */

  async function getSubscription(
    OneSignal,
    timeoutMs
  ) {

    const started =
      Date.now();


    while (
      Date.now() -
      started <
      timeoutMs
    ) {

      try {

        const subscription =
          OneSignal
            ?.User
            ?.PushSubscription;


        if (
          subscription
        ) {

          const subscriptionId =
            String(
              subscription.id || ''
            ).trim();


          const optedIn =
            subscription.optedIn ===
            true;


          /*
           * Kondisi sukses:
           *
           * 1. subscription ID ada
           * 2. subscription opted in
           *
           * Tidak menunggu push token.
           */

          if (
            subscriptionId &&
            optedIn
          ) {

            return {
              subscriptionId:
                subscriptionId
            };

          }

        }

      } catch (
        error
      ) {

        console.warn(
          'Menunggu subscription OneSignal:',
          error
        );

      }


      await new Promise(
        function (
          resolve
        ) {

          setTimeout(
            resolve,
            500
          );

        }
      );

    }


    throw new Error(
      'OneSignal belum menyediakan Subscription ID. Pastikan izin notifikasi sudah diberikan dan status OneSignal sudah Subscribed.'
    );

  }


  /*
   * ============================================================
   * REGISTER SUBSCRIPTION KE GAS
   * ============================================================
   */

  async function registerSubscription(
    subscriptionId
  ) {

    const response =
      await callGas({

        push:
          'register',

        activate:
          activationToken,

        m:
          madrasahId,

        subscriptionId:
          subscriptionId,

        deviceLabel:
          (
            navigator.userAgent ||
            'Perangkat'
          ).slice(
            0,
            120
          )

      });


    if (
      !response ||
      response.success !== true
    ) {

      throw new Error(
        response &&
        response.message
          ? response.message
          : 'Subscription gagal disimpan oleh Google Apps Script.'
      );

    }


    return response;

  }


  /*
   * ============================================================
   * AKTIVASI NOTIFIKASI
   * ============================================================
   */

  async function activate() {

    button.disabled =
      true;


    button.textContent =
      'MEMPROSES...';


    setStatus(
      'Menyiapkan notifikasi...',
      'muted'
    );


    try {

      /*
       * --------------------------------------------------------
       * 1. Pastikan activationInfo tersedia
       * --------------------------------------------------------
       */

      if (
        !activationInfo
      ) {

        activationInfo =
          await getActivationInfo();

      }


      /*
       * --------------------------------------------------------
       * 2. Inisialisasi OneSignal
       * --------------------------------------------------------
       */

      setStatus(
        'Menghubungkan ke OneSignal...',
        'muted'
      );


      const OneSignal =
        await initOneSignal();


      /*
       * --------------------------------------------------------
       * 3. Pastikan browser mendukung push
       * --------------------------------------------------------
       */

      if (
        OneSignal.Notifications &&
        typeof
          OneSignal
            .Notifications
            .isPushSupported ===
          'function'
      ) {

        const supported =
          OneSignal
            .Notifications
            .isPushSupported();


        if (
          !supported
        ) {

          throw new Error(
            'Browser/perangkat ini tidak mendukung Web Push.'
          );

        }

      }


      /*
       * --------------------------------------------------------
       * 4. Cek permission
       * --------------------------------------------------------
       */

      if (
        'Notification' in window
      ) {

        if (
          Notification.permission ===
          'denied'
        ) {

          throw new Error(
            'Izin notifikasi untuk situs ini ditolak. Reset izin situs lalu buka kembali link aktivasi.'
          );

        }

      }


      /*
       * --------------------------------------------------------
       * 5. Minta izin notifikasi
       * --------------------------------------------------------
       */

      setStatus(
        'Meminta izin notifikasi...',
        'muted'
      );


      if (
        OneSignal.Notifications &&
        typeof
          OneSignal
            .Notifications
            .requestPermission ===
          'function'
      ) {

        await OneSignal
          .Notifications
          .requestPermission();

      }


      /*
       * --------------------------------------------------------
       * 6. Login OneSignal menggunakan identitas guru
       * --------------------------------------------------------
       *
       * Format dipertahankan:
       *
       * MADRASAH_ID:KODE_GURU
       */

      const kodeGuru =
        String(
          activationInfo.kodeGuru ||
          ''
        ).trim();


      if (
        !kodeGuru
      ) {

        throw new Error(
          'Kode guru tidak tersedia dari data aktivasi.'
        );

      }


      const externalId =
        madrasahId +
        ':' +
        kodeGuru;


      setStatus(
        'Menghubungkan perangkat dengan guru...',
        'muted'
      );


      await OneSignal.login(
        externalId
      );


      /*
       * --------------------------------------------------------
       * 7. Pastikan subscription opt-in
       * --------------------------------------------------------
       */

      const pushSubscription =
        OneSignal
          ?.User
          ?.PushSubscription;


      if (
        pushSubscription &&
        typeof
          pushSubscription.optIn ===
          'function'
      ) {

        await pushSubscription
          .optIn();

      }


      /*
       * --------------------------------------------------------
       * 8. Ambil Subscription ID
       * --------------------------------------------------------
       */

      setStatus(
        'Menunggu Subscription ID...',
        'muted'
      );


      const subscription =
        await getSubscription(
          OneSignal,
          30000
        );


      /*
       * --------------------------------------------------------
       * 9. REGISTER KE GAS
       * --------------------------------------------------------
       */

      setStatus(
        'Menyimpan aktivasi...',
        'muted'
      );


      await registerSubscription(
        subscription.subscriptionId
      );


      /*
       * --------------------------------------------------------
       * 10. BERHASIL
       * --------------------------------------------------------
       */

      button.disabled =
        true;


      button.textContent =
        '✅ NOTIFIKASI AKTIF';


      setStatus(
        'Notifikasi berhasil diaktifkan pada perangkat ini.',
        'ok'
      );


    } catch (
      error
    ) {

      console.error(
        'Push activation error:',
        error
      );


      button.disabled =
        false;


      button.textContent =
        '🔔 IZINKAN NOTIFIKASI';


      setStatus(
        error &&
        error.message
          ? error.message
          : 'Gagal mengaktifkan notifikasi.',
        'err'
      );

    }

  }


  /*
   * ============================================================
   * START
   * ============================================================
   */

  async function start() {

    button.disabled =
      true;


    try {

      /*
       * Validasi konfigurasi.
       */

      if (
        !cfg.GAS_WEB_APP_URL
      ) {

        throw new Error(
          'GAS_WEB_APP_URL belum tersedia.'
        );

      }


      if (
        !cfg.ONESIGNAL_APP_ID
      ) {

        throw new Error(
          'ONESIGNAL_APP_ID belum tersedia.'
        );

      }


      /*
       * Validasi link.
       */

      if (
        !activationToken
      ) {

        throw new Error(
          'Link aktivasi tidak memiliki token.'
        );

      }


      if (
        !madrasahId
      ) {

        throw new Error(
          'Link aktivasi tidak memiliki ID madrasah.'
        );

      }


      /*
       * Verifikasi token ke GAS.
       */

      setStatus(
        'Memverifikasi link aktivasi...',
        'muted'
      );


      activationInfo =
        await getActivationInfo();


      const kodeGuru =
        String(
          activationInfo.kodeGuru ||
          ''
        ).trim();


      const namaGuru =
        String(
          activationInfo.nama ||
          activationInfo.namaGuru ||
          ''
        ).trim();


      if (
        namaGuru
      ) {

        intro.textContent =
          'Guru ' +
          namaGuru +
          ' (' +
          kodeGuru +
          ') terverifikasi. Klik tombol untuk mengaktifkan notifikasi.';

      } else {

        intro.textContent =
          'Kode guru ' +
          kodeGuru +
          ' terverifikasi. Klik tombol untuk mengaktifkan notifikasi.';

      }


      setStatus(
        'Link aktivasi valid. Siap mengaktifkan notifikasi.',
        'muted'
      );


      button.disabled =
        false;


    } catch (
      error
    ) {

      console.error(
        'Activation verification error:',
        error
      );


      intro.textContent =
        'Aktivasi tidak dapat dilanjutkan.';


      setStatus(
        error &&
        error.message
          ? error.message
          : 'Link aktivasi tidak valid.',
        'err'
      );


      button.disabled =
        true;

    }

  }


  /*
   * Tombol aktivasi.
   */

  button.addEventListener(
    'click',
    activate
  );


  /*
   * Jalankan pemeriksaan awal.
   */

  start();

})();
</script>

</body>
</html>
